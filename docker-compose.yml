services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: event-ingestion-api:local
    environment:
      ASPNETCORE_URLS: http://+:8080
      Messaging__Provider: RabbitMQ
      Messaging__RabbitMQ__HostName: rabbitmq
      Messaging__RabbitMQ__Port: 5672
      Messaging__RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER:-eventing}
      Messaging__RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS:-local-development-only}
      Messaging__RabbitMQ__UseTls: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    container_name: event-ingestion-rabbitmq
    hostname: event-ingestion-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-eventing}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-local-development-only}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  rabbitmq-data:
