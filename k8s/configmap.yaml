apiVersion: v1
kind: ConfigMap
metadata:
  name: event-ingestion-config
  namespace: ${K8S_NAMESPACE}
data:
  Messaging__Provider: AzureServiceBus
  Messaging__AzureServiceBus__FullyQualifiedNamespace: ${SERVICE_BUS_NAMESPACE}
  Messaging__AzureServiceBus__EntityName: ${SERVICE_BUS_TOPIC}
  Messaging__AzureServiceBus__EntityType: Topic
  Entra__TenantId: ${ENTRA_TENANT_ID}
  Entra__ClientId: ${ENTRA_API_CLIENT_ID}
  Http__RedirectToHttps: "false"
  Caddyfile: |
    {
      admin off
      http_port 8081
      https_port 8443
      email ${ACME_EMAIL}
    }
    ${PUBLIC_HOST} {
      reverse_proxy 127.0.0.1:8080
    }
