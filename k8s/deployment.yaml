apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: event-ingestion-tls
  namespace: ${K8S_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-ingestion
  namespace: ${K8S_NAMESPACE}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: event-ingestion
  template:
    metadata:
      labels:
        app: event-ingestion
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      securityContext:
        fsGroup: 10001
      containers:
        - name: api
          image: ${IMAGE}
          ports:
            - containerPort: 8080
              name: api
          envFrom:
            - configMapRef:
                name: event-ingestion-config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 7
          livenessProbe:
            httpGet:
              path: /health/live
              port: api
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
        - name: tls-proxy
          image: caddy:2.11.9@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
          ports:
            - containerPort: 8081
              name: http
            - containerPort: 8443
              name: https
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 20
          env:
            - name: XDG_CONFIG_HOME
              value: /data/config
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: proxy-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: proxy-config
          configMap:
            name: event-ingestion-config
            items:
              - key: Caddyfile
                path: Caddyfile
        - name: proxy-data
          persistentVolumeClaim:
            claimName: event-ingestion-tls
