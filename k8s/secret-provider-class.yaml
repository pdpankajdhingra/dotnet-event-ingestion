# Optional: render and apply only after a real secret exists in Key Vault.
# Mount this SecretProviderClass in a workload before expecting files to appear.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: event-ingestion-secrets
  namespace: ${K8S_NAMESPACE}
spec:
  provider: azure
  parameters:
    clientID: ${WORKLOAD_IDENTITY_CLIENT_ID}
    keyvaultName: ${KEY_VAULT_NAME}
    tenantId: ${ENTRA_TENANT_ID}
    objects: |
      array:
        - |
          objectName: ${KEY_VAULT_SECRET_NAME}
          objectType: secret
