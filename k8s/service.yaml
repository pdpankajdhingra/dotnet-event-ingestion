apiVersion: v1
kind: Service
metadata:
  name: event-ingestion-public
  namespace: ${K8S_NAMESPACE}
  annotations:
    service.beta.kubernetes.io/azure-dns-label-name: ${DNS_LABEL}
spec:
  type: LoadBalancer
  selector:
    app: event-ingestion
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
